<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student - School Result Portal</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <h1>Add Student</h1>
        <p>Register a new student</p>
    </header>

    <main class="container">

        <section class="hero">

            <h2>Student Information</h2>

            <form id="studentForm">

                <p>
                    <label for="studentId">Student ID</label>
                </p>

                <p>
                    <input type="text" id="studentId"
                        placeholder="e.g. STU001" required>
                </p>

                <p>
                    <label for="fullName">Full Name</label>
                </p>

                <p>
                    <input type="text" id="fullName"
                        placeholder="Enter student's full name" required>
                </p>

                <p>
                    <label for="gender">Gender</label>
                </p>

                <p>
                    <select id="gender" required>
                        <option value="">Select gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </p>

<p>
    <label for="className">Class</label>
</p>

<p>
    <select id="className" required>
        <option value="">Select class</option>
        <option value="JSS 1">JSS 1</option>
        <option value="JSS 2">JSS 2</option>
        <option value="JSS 3">JSS 3</option>
        <option value="SS 1">SS 1</option>
        <option value="SS 2">SS 2</option>
        <option value="SS 3">SS 3</option>
    </select>
</p>                <p>
                    <label for="session">Academic Session</label>
                </p>

                <p>
                    <input type="text" id="session"
                        placeholder="e.g. 2026/2027" required>
                </p>

                <p>
                    <label for="term">Term</label>
                </p>

                <p>
                    <select id="term" required>
                        <option value="">Select term</option>
                        <option value="First Term">First Term</option>
                        <option value="Second Term">Second Term</option>
                        <option value="Third Term">Third Term</option>
                    </select>
                </p>

                <div class="buttons">

                    <button type="submit" class="btn">
                        Add Student
                    </button>

                    <a href="dashboard.html" class="btn secondary">
                        Back to Dashboard
                    </a>

                </div>

            </form>

            <p id="message"></p>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 School Result Portal</p>
    </footer>

    <script src="js/app.js"></script>

</body>

</html>
