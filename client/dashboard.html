<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - School Result Portal</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <h1>School Result Portal</h1>

        <p>Teacher Dashboard</p>

    </header>


    <main class="dashboard-container">

        <section class="dashboard-card">

            <h2>Teacher Dashboard</h2>

            <p id="welcomeMessage">
                Welcome, Teacher
            </p>

        

<section class="dashboard-actions">

    <a href="add-student.html" class="dashboard-btn">
        Add Student
    </a>

    <a href="add-result.html" class="dashboard-btn">
        Add Result
    </a>

    <a href="student-result.html" class="dashboard-btn">
        View Result
    </a>

    <button id="logoutButton" class="dashboard-btn logout-btn">
        Logout
    </button>

</section>
        


        <section class="dashboard-info">

            <div class="info-card">
                <h3>Students</h3>
                <p id="studentCount">0</p>
            </div>

            <div class="info-card">
                <h3>Results</h3>
                <p id="resultCount">0</p>
            </div>

        </section>

    </main>


    <footer class="footer">

        <p>
            &copy; 2026 School Result Portal
        </p>

    </footer>

<script src="js/app.js"></script>


</body>

</html>
