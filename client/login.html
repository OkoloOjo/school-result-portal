<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - School Result Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

<header class="header">
    <h1>School Result Portal</h1>
    <p>Student Academic Management System</p>
</header>

<main class="login-container">

    <div class="login-card">

        <h2>Login</h2>

        <p class="login-description">
            Login to access the portal
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            <div class="form-group">
                <label for="role">Login As</label>
                <select id="role" name="role" required>
                    <option value="">Select role</option>
                    <option value="teacher">Teacher</option>
                    <option value="student">Student</option>
                </select>
            </div>

            <button type="submit" class="btn">
                Login
            </button>

        </form>

        <div class="divider" style="text-align:center; margin: 16px 0; color:#888;">OR</div>

        <div id="g_id_onload"
             data-client_id="184102525492-61u1ham3hio96rpkj3ga1uve3psrolsb.apps.googleusercontent.com"
             data-callback="handleGoogleLogin">
        </div>
        <div class="g_id_signin" data-type="standard" style="display:flex; justify-content:center;"></div>

        <div id="loginMessage"></div>

    </div>

</main>

<footer class="footer">
    <p>&copy; 2026 School Result Portal</p>
</footer>

<script src="js/app.js"></script>

</body>
</html>
