<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Result - School Result Portal</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <h1>School Result Portal</h1>

        <p>Add Student Result</p>

    </header>


    <main class="login-container">

        <div class="login-card">

            <h2>Add Result</h2>

            <p class="login-description">
                Enter the student's subject score
            </p>


            <form id="resultForm">

                <div class="form-group">

                    <label for="studentId">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        name="studentId"
                        placeholder="Enter student ID"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="studentName">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="studentName"
                        name="studentName"
                        placeholder="Enter student name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="e.g. Mathematics"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="score">
                        Score
                    </label>

                    <input
                        type="number"
                        id="score"
                        name="score"
                        placeholder="Enter score"
                        min="0"
                        max="100"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn">
                    Save Result
                </button>

            </form>


            <div id="resultMessage"></div>


            <br>


            <a
                href="dashboard.html"
                class="btn"
                style="display: block; text-align: center; text-decoration: none;">
                Back to Dashboard
            </a>

        </div>

    </main>


    <footer class="footer">

        <p>
            &copy; 2026 School Result Portal
        </p>

    </footer>


    <script src="js/add-result.js"></script>

</body>

</html>
