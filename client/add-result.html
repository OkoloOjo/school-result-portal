<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enter Result - School Result Portal</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <h1>Enter Student Result</h1>
        <p>Record a student's subject score</p>
    </header>

    <main class="container">

        <section class="form-card">

            <h2>Result Information</h2>

            <form id="resultForm">

                <div class="form-group">

                    <label for="studentId">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        name="studentId"
                        placeholder="Example: STU003"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="Example: Mathematics"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="score">
                        Score
                    </label>

                    <input
                        type="number"
                        id="score"
                        name="score"
                        min="0"
                        max="100"
                        placeholder="Enter score (0 - 100)"
                        required
                    >

                </div>

                <button type="submit" class="btn">
                    Save Result
                </button>

                <p id="resultMessage"></p>

            </form>

            <br>

            <a href="index.html" class="btn secondary">
                Back to Home
            </a>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 School Result Portal</p>
    </footer>

    <script src="js/app.js"></script>

</body>

</html>
