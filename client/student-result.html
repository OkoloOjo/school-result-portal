<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result - School Result Portal</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <h1>School Result Portal</h1>

        <p>Student Result</p>

    </header>


    <main class="login-container">

        <div class="login-card">

            <h2>Check Result</h2>

            <p class="login-description">
                Enter your Student ID to view your result.
            </p>


            <form id="studentResultForm">

                <div class="form-group">

                    <label for="studentId">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        name="studentId"
                        placeholder="Enter your Student ID"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn">
                    View Result
                </button>

            </form>


            <div id="resultMessage"></div>

        </div>


        <section
            id="resultContainer"
            class="login-card"
            style="display: none;">

            <h2>Student Result</h2>

            <div id="studentDetails"></div>

            <div id="resultTable"></div>

            <div id="resultSummary"></div>

            <br>

            <button
                id="printResult"
                class="btn">
                Print Result
            </button>

        </section>

    </main>


    <footer class="footer">

        <p>
            &copy; 2026 School Result Portal
        </p>

    </footer>


    <script src="js/app.js"></script>

</body>

</html>
