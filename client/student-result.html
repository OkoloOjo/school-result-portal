<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result - School Result Portal</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <h1>Student Result</h1>
        <p>View your academic result</p>
    </header>

    <main class="container">

        <section class="hero">

            <h2>Check Your Result</h2>

            <p>
                Enter your student ID to view your academic result.
            </p>

            <form id="resultForm">

                <input
                    type="text"
                    id="studentId"
                    placeholder="Enter Student ID"
                    required
                >

                <button type="submit" class="btn">
                    View Result
                </button>

            </form>

            <div id="resultMessage"></div>

            <br>

            <a href="index.html" class="btn secondary">
                Back to Home
            </a>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 School Result Portal</p>
    </footer>

</body>

</html>
