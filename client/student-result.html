<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>View Student Result</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <header class="header">

        <h1>School Result Portal</h1>

        <p>Student Result Portal</p>

    </header>


    <main class="login-container">

        <section class="login-card">

            <h2>View Your Result</h2>

            <p class="login-description">
                Enter your Student ID to view your result.
            </p>


            <form id="studentResultForm">

                <div class="form-group">

                    <label for="studentId">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        name="studentId"
                        placeholder="Enter Student ID"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    View Result
                </button>

            </form>


            <div id="resultMessage"></div>

        </section>


        <section
            id="resultContainer"
            class="dashboard-card"
            style="display: none;"
        >

            <h2>Student Result</h2>


            <div id="studentDetails"></div>


            <div id="resultTable"></div>


            <div id="resultSummary"></div>


            <button
                type="button"
                id="printResult"
                class="btn"
                style="margin-top: 20px;"
            >
                Print Result
            </button>

        </section>

    </main>


    <footer class="footer">

        <p>
            &copy; 2026 School Result Portal
        </p>

    </footer>


    <script src="js/app.js"></script>

</body>

</html>
